[package]
name = "roomba-flasher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "RoombaFlasher"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
rfd    = "0.15"
md-5   = "0.10"

[profile.release]
lto           = true
codegen-units = 1
strip         = true
